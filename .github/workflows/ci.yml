name: CI

# Die lokale Wahrheit bleibt Shinon (tools/shinon/hook-entry.mjs): sein Gate umfasst Typecheck,
# Tests, LOC-Caps, Architektur-Constraints, Changelog-Pflicht und Doku-Links, und er
# entscheidet über Commit und Push. Diese Action beweist nur, dass ein FRISCHER Klon
# dieselben Kernprüfungen besteht — das war vor dem Versionieren des Tooling nicht
# maschinell beweisbar (Befund: der Beweis galt nur auf einer Maschine).
#
# Bewusst NICHT hier: Shinons Gate selbst. Es braucht die lokale Hook-Verdrahtung
# (core.hooksPath) und schreibt README/State — ein zweiter Gate-Lauf in CI wäre eine
# zweite Wahrheit desselben Vertrags, nicht ein Beweis.
#
# LOCKFREI, mit Absicht: `package-lock.json` und `bun.lock` sind im Repo bewusst
# untracked (`.gitignore`, Commit 49ff364 „untrack lockfile conflict"). `npm ci` und
# `setup-node` mit `cache: npm` setzen eine getrackte Lockdatei VORAUS und ließen den
# Job vor der ersten Prüfung abbrechen („Dependencies lock file is not found").
# Deshalb `npm install` ohne Cache. Preis, ehrlich benannt: ohne Lockdatei ist der
# aufgelöste Abhängigkeitsbaum nicht eingefroren — CI und Plattform-Build können
# geringfügig auseinanderlaufen. Wer das abdrehen will, trackt eine Lockdatei und
# stellt diesen Schritt wieder auf `npm ci` + `cache: npm` zurück. Beides zusammen
# ist der Fehler, nicht die einzelne Zeile.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 spiegelt die Plattform (der Deploy-Lauf meldete nodejs@24.18.0).
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dependencies installieren
        run: npm install --no-audit --no-fund

      # Golden-Hash-Anker für das Vector-Gate: fail-closed auch hier — fehlt das Secret,
      # bricht der Job ab, statt dass die Suite ohne Anker läuft (der Test selbst ist
      # bei fehlendem Anker längst rot; der Secret-Check macht die Ursache sofort lesbar).
      # Der Wert liegt AUSSCHLIESSLICH im Secret — nie committet, nie in Logs ausgegeben.
      - name: Golden-Hash-Anker aus Repo-Secret injizieren
        env:
          GOLDEN_HASH: ${{ secrets.GOLDEN_HASH }}
        run: |
          if [ -z "$GOLDEN_HASH" ]; then
            echo "::error::Repo-Secret GOLDEN_HASH ist nicht gesetzt — Vector-Gate kann ohne Anker nicht pruefen."
            exit 1
          fi
          mkdir -p tools/.tmp
          printf '%s' "$GOLDEN_HASH" > tools/.tmp/vector_golden_hash.txt

      - name: Typecheck (tsc -b --noEmit)
        run: node node_modules/typescript/bin/tsc -b --noEmit

      - name: Test-Suite
        run: node scripts/test-lane.mjs --full

      # Die Testzahl wird GEMESSEN und veroeffentlicht, nie abgeschrieben (Befund 20.09.2026:
      # README nannte 570/570 in 61 Dateien, die Lane mass 662 in 66). Der Schritt scheitert,
      # sobald eine Doku wieder eine hartkodierte Testzahl traegt.
      - name: Testzahl messen und abgeschriebene Zahlen abweisen
        run: node scripts/test-count.mjs

      # Tooling-eigene Tests: das Gate prüft sich selbst (Fixtures unter tools/.tmp).
      - name: Shinon-Tooling-Suite
        run: node node_modules/vitest/vitest.mjs run --config tools/vitest.config.ts

      # Das Qualitäts-Register muss auf dem Stand seiner Domänen-Contracts sein.
      - name: Qualitäts-Register gegen Contracts prüfen
        run: node scripts/quality-register.mjs --check
