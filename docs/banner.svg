<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#101a14"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- DNA helix motif -->
  <g stroke="#4ade80" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M 120 60 C 160 90, 160 130, 120 160 C 80 190, 80 230, 120 260"/>
    <path d="M 160 60 C 120 90, 120 130, 160 160 C 200 190, 200 230, 160 260"/>
  </g>
  <g stroke="#a78bfa" stroke-opacity="0.5" stroke-width="3">
    <line x1="122" y1="80" x2="158" y2="80"/>
    <line x1="128" y1="110" x2="152" y2="110"/>
    <line x1="122" y1="140" x2="158" y2="140"/>
    <line x1="128" y1="190" x2="152" y2="190"/>
    <line x1="122" y1="220" x2="158" y2="220"/>
  </g>

  <!-- sprout icon -->
  <g transform="translate(255,175)">
    <path d="M 0 60 C 0 30, -5 15, 0 0" stroke="#86efac" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-18" cy="8" rx="20" ry="10" fill="#4ade80" transform="rotate(-30 -18 8)"/>
    <ellipse cx="18" cy="-2" rx="20" ry="10" fill="#a78bfa" transform="rotate(28 18 -2)"/>
  </g>

  <!-- title -->
  <text x="330" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="2">LifeGamePlant</text>

  <!-- tagline -->
  <text x="332" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#9ca3af">PvZ × Isaac — deine Kreuzungen sind deine Türme.</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="332" y="228" width="150" height="34" rx="17" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.5"/>
    <text x="407" y="250" text-anchor="middle" fill="#4ade80">Züchten</text>

    <rect x="494" y="228" width="150" height="34" rx="17" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="569" y="250" text-anchor="middle" fill="#fbbf24">Wellen-TD</text>

    <rect x="656" y="228" width="150" height="34" rx="17" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="731" y="250" text-anchor="middle" fill="#a78bfa">Determinismus</text>

    <rect x="818" y="228" width="150" height="34" rx="17" fill="#60a5fa" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="893" y="250" text-anchor="middle" fill="#60a5fa">Canvas</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="297" rx="18" fill="none" stroke="#1e293b" stroke-width="3"/>
</svg>
